<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3559E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escuela Dimanche">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Escuela Dimanche</title>
<style>
:root{--azul:#3559E0;--crudo:#E9E3D9;--negro:#000;--gris:#55524C;--blanco:#fff;--f:"Niveau Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--blanco);color:var(--negro);font-family:var(--f);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--azul);color:var(--blanco);padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.top b{display:block;font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}.top small{font-size:13px}
main{flex:1;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));width:100%;max-width:520px;margin:0 auto}
h1{font-weight:900;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--azul);margin:0 0 10px}
p{margin:0 0 14px}.muted{color:var(--gris);font-size:15px}
label{display:block;font-weight:700;font-size:15px;margin:16px 0 6px}
input[type=email],input[type=text],input[type=password]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1.5px solid var(--negro);border-radius:2px;background:var(--blanco);color:var(--negro);min-height:52px}
input:focus-visible,button:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:400;margin-top:16px;cursor:pointer}.check input{width:22px;height:22px;accent-color:var(--azul)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;bottom:6px;font:inherit;font-size:14px;font-weight:700;background:var(--blanco);color:var(--azul);border:0;padding:0 10px;cursor:pointer}
.btn{width:100%;margin-top:22px;font:inherit;font-weight:700;font-size:18px;padding:14px;border-radius:2px;border:2px solid var(--azul);background:var(--azul);color:var(--blanco);cursor:pointer;min-height:54px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{background:var(--azul);color:var(--blanco);padding:14px 16px;margin:16px 0;font-weight:700}
footer{padding:16px;text-align:center;font-size:13px;color:var(--gris)}
#cargando{padding:40px 16px;text-align:center;color:var(--gris)}
</style>
</head>
<body>
<header class="top"><b>Dimanche</b><small>Con olorcito a domingo · Escuela</small></header>
<main>
  <div id="cargando">Abriendo la Escuela…</div>
  <div id="login" hidden>
    <h1>Entrá a la Escuela</h1>
    <p class="muted">Usá tu mail y la contraseña que te dio Operaciones.</p>
    <div class="err" id="err" role="alert" hidden></div>
    <form id="f" autocomplete="on">
      <label for="email">Tu mail</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <div class="pw"><input id="pass" name="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" id="ver">Ver</button></div>
      <label class="check"><input type="checkbox" id="rec" checked> Recordarme en este celular</label>
      <button class="btn" id="go" type="submit">Entrar</button>
    </form>
    <p class="muted" style="margin-top:22px">¿Te olvidaste la contraseña? Pedile una nueva a tu encargada o a Operaciones.</p>
  </div>
</main>
<footer>Uso interno de Dimanche. No compartas tu contraseña.</footer>

<script>
(function(){
  var D = JSON.parse(document.getElementById('d').textContent);
  var enc = new TextEncoder(), dec = new TextDecoder();
  function ub(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  var S = window.crypto && window.crypto.subtle;
  var $ = function(id){return document.getElementById(id)};
  function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  function abrir(rawK, nombre){
    return S.importKey('raw', ub(rawK), 'AES-GCM', false, ['decrypt'])
      .then(function(k){return S.decrypt({name:'AES-GCM',iv:ub(D.iv)}, k, ub(D.c))})
      .then(function(buf){
        var html = dec.decode(buf).replace('__NOMBRE__', String(nombre||'equipo').replace(/[<>&"]/g,''));
        document.open(); document.write(html); document.close();
      });
  }
  function mostrarLogin(msg){
    $('cargando').hidden = true; $('login').hidden = false;
    if(msg){$('err').textContent = msg; $('err').hidden = false}
  }
  if(!S){ mostrarLogin('Este navegador no puede abrir la Escuela. Probá con Chrome o Safari actualizados.'); $('go').disabled = true; return; }

  var guardada = load('esc-llave');
  if(guardada){
    var g; try{g=JSON.parse(guardada)}catch(e){g=null}
    if(g && g.k){ abrir(g.k, g.n).catch(function(){ store('esc-llave',null); mostrarLogin('Tu acceso cambió. Volvé a entrar con tu mail y contraseña.'); }); }
    else mostrarLogin();
  } else mostrarLogin();

  $('ver').addEventListener('click',function(){var p=$('pass');var v=p.type==='password';p.type=v?'text':'password';this.textContent=v?'Ocultar':'Ver'});

  var fallos = 0;
  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('email').value.trim().toLowerCase();
    var pass = $('pass').value.trim().toLowerCase();
    $('err').hidden = true; $('go').disabled = true; $('go').textContent = 'Entrando…';
    function fail(){
      fallos++;
      $('go').disabled = false; $('go').textContent = 'Entrar';
      $('err').textContent = 'El mail o la contraseña no coinciden. Revisalos o pedile ayuda a tu encargada.';
      $('err').hidden = false;
      if(fallos >= 5){ $('go').disabled = true; setTimeout(function(){ $('go').disabled = false; fallos = 0 }, 30000); $('err').textContent = 'Muchos intentos. Esperá 30 segundos y probá de nuevo.'; }
    }
    S.digest('SHA-256', new Uint8Array([].concat(Array.from(ub(D.p)), Array.from(enc.encode(email)))))
      .then(function(h){
        var u = D.u[hex(h)];
        if(!u) throw new Error('no');
        return S.importKey('raw', enc.encode(email + ':' + pass), 'PBKDF2', false, ['deriveKey'])
          .then(function(base){ return S.deriveKey({name:'PBKDF2', salt:ub(u[0]), iterations:D.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']) })
          .then(function(wk){ return S.decrypt({name:'AES-GCM', iv:ub(u[1])}, wk, ub(u[2])) });
      })
      .then(function(buf){
        var p = JSON.parse(dec.decode(buf));
        if($('rec').checked) store('esc-llave', JSON.stringify(p));
        return abrir(p.k, p.n);
      })
      .catch(fail);
  });
})();
</script>
